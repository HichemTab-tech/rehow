[package]
name = "rehow-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rehow_desktop"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
libc = "=0.2.189"
rehow-core = { path = "../../../crates/rehow-core" }
rfd = { version = "=0.17.2", default-features = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
