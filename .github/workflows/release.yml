name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release tag and version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v." >&2
            exit 1
          fi
          app_version="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match application version $app_version." >&2
            exit 1
          fi
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            bubblewrap \
            build-essential \
            file \
            libarchive-tools \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.20.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.2.0
          cache: pnpm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.98.0

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          pnpm check
          pnpm test
          pnpm test:integration
          python3 scripts/check_bootstrap.py

      - name: Build and inspect release packages
        run: |
          pnpm tauri:build
          scripts/test-linux-bundles.sh

      - name: Collect release artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          deb="target/release/bundle/deb/Rehow_${version}_amd64.deb"
          rpm="target/release/bundle/rpm/Rehow-${version}-1.x86_64.rpm"
          test -f "$deb"
          test -f "$rpm"
          mkdir release-artifacts
          cp -- "$deb" "$rpm" release-artifacts/
          cd release-artifacts
          sha256sum "$(basename "$deb")" "$(basename "$rpm")" > "Rehow_${version}_SHA256SUMS.txt"

      - name: Store isolated release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehow-linux-${{ env.RELEASE_TAG }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Upload assets to GitHub Release
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Download isolated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rehow-linux-${{ env.RELEASE_TAG }}
          path: release-artifacts

      - name: Verify artifact inventory and checksums
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          test -f "release-artifacts/Rehow_${version}_amd64.deb"
          test -f "release-artifacts/Rehow-${version}-1.x86_64.rpm"
          test -f "release-artifacts/Rehow_${version}_SHA256SUMS.txt"
          test "$(find release-artifacts -mindepth 1 -maxdepth 1 | wc -l)" = "3"
          test "$(wc -l < "release-artifacts/Rehow_${version}_SHA256SUMS.txt")" = "2"
          sums="release-artifacts/Rehow_${version}_SHA256SUMS.txt"
          awk 'NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 }' "$sums"
          expected_names="$(printf '%s\n%s\n' \
            "Rehow-${version}-1.x86_64.rpm" \
            "Rehow_${version}_amd64.deb" | sort)"
          actual_names="$(awk '{ print $2 }' "$sums" | sort)"
          test "$actual_names" = "$expected_names"
          (cd release-artifacts && sha256sum --check "Rehow_${version}_SHA256SUMS.txt")

      - name: Confirm published GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"

      - name: Upload Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "release-artifacts/Rehow_${version}_amd64.deb" \
            "release-artifacts/Rehow-${version}-1.x86_64.rpm" \
            "release-artifacts/Rehow_${version}_SHA256SUMS.txt" \
            --clobber
