name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            bubblewrap \
            build-essential \
            file \
            libarchive-tools \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.20.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.2.0
          cache: pnpm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.98.0

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, types, lint, and contracts
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          pnpm check

      - name: Run unit and integration tests
        run: |
          pnpm test
          pnpm test:integration

      - name: Build and inspect native packages
        run: |
          pnpm tauri:build
          scripts/test-linux-bundles.sh

      - name: Validate durable project state
        run: |
          python3 scripts/check_bootstrap.py
          git diff --exit-code
