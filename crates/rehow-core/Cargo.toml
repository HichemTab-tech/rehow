[package]
name = "rehow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rehow-git-ssh"
path = "src/bin/rehow-git-ssh.rs"

[[bin]]
name = "rehow-git-credential"
path = "src/bin/rehow-git-credential.rs"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
focaccia = { version = "=2.0.0", default-features = false }
notify = { version = "=8.2.0", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }
raw-window-handle = "=0.6.2"
rfd = { version = "=0.17.2", default-features = true }
rowan = "=0.16.1"
saphyr-parser = "=0.0.12"
serde = { version = "=1.0.229", features = ["derive"] }
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
ts-rs = "=12.0.1"
tempfile = { version = "=3.23.0", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false }
url = { version = "=2.5.8", default-features = false }
uuid = { version = "=1.26.0", default-features = false, features = ["std", "v7"] }
yaml-edit = { version = "=0.3.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "=0.18.4", default-features = false }
libc = { version = "=0.2.189", default-features = false }

[dev-dependencies]
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
trybuild = { version = "=1.0.120", default-features = false }
